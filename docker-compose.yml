services:

  catalog:
    image: postgres:17
    container_name: fedproject-catalog
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fedproject

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: fedproject-rustfs
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    command: ["/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:9000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fedproject

  create-bucket:
    image: rustfs/rc:latest
    container_name: fedproject-create-bucket
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_BUCKET: ${S3_BUCKET:-fed_data_pipeline}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/rc alias set rustfs http://rustfs:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; do
          echo "Waiting for RustFS..."
          sleep 2
        done
        /usr/bin/rc ls "rustfs/$${S3_BUCKET}" >/dev/null 2>&1 || /usr/bin/rc mb "rustfs/$${S3_BUCKET}"
        echo "RustFS bucket ready: $${S3_BUCKET}"
    networks:
      - fedproject

  metabase:
    build:
      context: ./metabase
      args:
        - METABASE_VERSION=0.63.18
    container_name: fedproject-metabase
    depends_on:
      catalog:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_PLUGINS_DIR: /plugins
    volumes:
      - metabase-data:/metabase-data
    networks:
      - fedproject

networks:
  fedproject:

volumes:
  catalog_data:
  rustfs-data:
  metabase-data:
