[project]
name = "fed_data_pipeline"
version = "0.6.0"
description = "Data engineering final project: federal reserve data pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.5.3",
    "prefect>=3.4",
    "httpx>=0.28.1",
    "loglyte>=1.0.0",
    "polars[pyarrow]>=1.44.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "botocore>=1.43.107",
    "boto3>=1.43.107",
]

# This week there's no Python package to build — dbt is the framework and your
# code is SQL. uv just manages the environment.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter for the provided scripts. Run `uv run ruff check .`
# Docs: https://docs.astral.sh/ruff/
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pipeline"]

[tool.ruff.lint]
#   E/W = pycodestyle, F = pyflakes, I = isort (import sorting),
#   B   = bugbear,     UP = pyupgrade, SIM = flake8-simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
